server.port=8085
spring.application.name=mscv-favorites

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true


#Eureka configuration
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT Configuration Properties
authorization.jwt.expiration.days=7
authorization.jwt.secret=AventuraPeSecureTokenKey2025WithStrongSecurityRequiredFor256Bits

# Enable snake case for Hibernate naming strategy
spring.jpa.hibernate.naming.physical-strategy=com.aventurape.favorites_service.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl


# Documentation properties
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# URLs de servicios externos
services.publication.url=http://post-service:8083
services.profile.url=http://profile-service:8082

# Logging Configuration
logging.level.com.aventurape.favorites_service.infrastructure.security.jwt=DEBUG

