# Test profile configuration
spring.application.name=mscv-profile-test

# Use H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate properties for testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable config server for tests
spring.cloud.config.enabled=false

# Disable Eureka for tests
eureka.client.enabled=false

# JWT Configuration for tests (same as production)
authorization.jwt.expiration.days=7
authorization.jwt.secret=AventuraPeSecureTokenKey2025WithStrongSecurityRequiredFor256Bits
