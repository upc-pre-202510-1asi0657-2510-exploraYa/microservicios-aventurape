spring.application.name=mscv-stats
spring.config.import=optional:configserver:http://localhost:8888
spring.profiles.active=dev

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/statservice
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8086

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.preferIpAddress=true

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security configurations
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/api/v1/authentication
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json
authorization.jwt.secret=AventuraPeSecureTokenKey2025WithStrongSecurityRequiredFor256Bits

# Feign Client URLs for service communication
feign.comments-service.url=http://localhost:8084
feign.post-service.url=http://localhost:8083

# Logging
logging.level.com.aventurape.stats_service=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.feign=DEBUG

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

# Configuración de Feign para servicios
feign.post-service.url=http://localhost:8083
feign.comments-service.url=http://localhost:8084

# Habilitar logs de Feign
logging.level.com.aventurape.stats_service.infrastructure.clients=DEBUG
logging.level.com.aventurape.stats_service.interfaces.rest.clients=DEBUG
